<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Income & Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Income & Expense Tracker</h1>
      <button id="themeToggle" class="btn btn-secondary">Toggle Dark Mode</button>
    </header>

    <main class="container">
      <section class="card">
        <h2>Set Monthly Budget</h2>
        <form id="budgetForm" class="inline-form">
          <input id="budgetInput" type="number" min="0" step="0.01" placeholder="Enter budget amount" required />
          <button type="submit" class="btn">Save Budget</button>
        </form>
      </section>

      <section class="card">
        <h2>Add Expense</h2>
        <form id="expenseForm" class="grid-form">
          <input id="amountInput" type="number" min="0" step="0.01" placeholder="Amount" required />
          <input id="dateInput" type="date" required />
          <input id="categoryInput" type="text" placeholder="Category (Food, Travel...)" required />
          <input id="descInput" type="text" placeholder="Description (optional)" />
          <button type="submit" class="btn">Add Expense</button>
        </form>
      </section>

      <section class="dashboard-grid">
        <article class="card stat-card">
          <h3>Budget</h3>
          <p id="budgetValue">0.00</p>
        </article>
        <article class="card stat-card">
          <h3>Total Expenses</h3>
          <p id="expensesValue">0.00</p>
        </article>
        <article class="card stat-card">
          <h3>Remaining</h3>
          <p id="remainingValue">0.00</p>
        </article>
        <article class="card stat-card">
          <h3>Profit / Loss</h3>
          <p id="plValue">0.00</p>
        </article>
      </section>

      <section class="card">
        <h2>Insights</h2>
        <div id="alertBox" class="alert hidden"></div>
        <ul id="insightsList"></ul>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Expenses</h2>
          <a class="btn btn-secondary" href="http://127.0.0.1:5000/api/export/csv">Export CSV</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="charts-grid">
        <article class="card">
          <h2>Category-wise Spending</h2>
          <canvas id="categoryPie"></canvas>
        </article>
        <article class="card">
          <h2>Weekly Expense Comparison</h2>
          <canvas id="weeklyBar"></canvas>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
  </html>
